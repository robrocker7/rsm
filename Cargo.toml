[package]
name = "rsm"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = "1.0"
serde_json = "1.0"
clap = { version = "3.0", features = ["env"] }
zerocopy = "0.7.31"
rand = "0.8.4"
time="0.2.23"
aes = "0.7.4"
block-modes = "0.8.1"
block-padding = "0.2.1"
hex = "0.4.3" # If you need to work with hex strings

[dependencies.rusqlite]
version = "0.30.0"
features = ["bundled-sqlcipher"]
